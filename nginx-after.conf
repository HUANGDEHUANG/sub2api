underscores_in_headers on;
server_tokens off;

# Restore visitor IPs when requests arrive through Cloudflare.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;
real_ip_recursive on;

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Only explicitly identified New API clients use a reusable HTTP/1.1 upstream
# connection. WebSocket requests keep the normal upgrade behavior.
map "$http_upgrade:$http_user_agent" $sub2api_connection {
    default close;
    ~*^.+: upgrade;
    ~*^:.*(?:canvas-newapi-gateway|shenxiang-new-api|new[-_]?api).* "";
}

upstream sub2api_backend {
    server 127.0.0.1:18136;
    keepalive 64;
}

limit_req_zone $binary_remote_addr zone=sub2api_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=sub2api_verify:10m rate=3r/m;
limit_req_zone $binary_remote_addr zone=sub2api_auth:10m rate=20r/m;

map $http_x_forwarded_proto $sub2api_forwarded_proto {
    default $scheme;
    http http;
    https https;
}

map "$scheme:$http_x_forwarded_proto:$http_cf_visitor" $sub2api_redirect_https {
    default 1;
    ~^https: 0;
    ~^http:https: 0;
    ~^http:.*"scheme":"https" 0;
}
